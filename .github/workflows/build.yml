name: build
# the whole pipeline on GitHub's runners; nothing is built locally.
#   1. payload: KytyPS5 for linux-x86-64 (debian 12 container) -> kyty-build.zip
#   2. apk:     host layer + app, with that Kyty build bundled inside -> sharpdroid-kyty.apk
# run it from Actions -> build -> Run workflow (works from a phone browser too).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "also publish a GitHub release with the files"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Kyty third-party sources (exact pins)
        run: python3 scripts/fetch-sources.py --only kyty
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: build/ccache
          key: ccache-kyty-${{ github.run_id }}
          restore-keys: ccache-kyty-
      - name: Build the Kyty payload in debian:12
        run: |
          set -o pipefail
          python3 scripts/build-kyty.py --package 2>&1 | tee build-kyty.log
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/ccache
          key: ccache-kyty-${{ github.run_id }}
      - name: The end of the log (read this when the build failed)
        if: failure()
        run: |
          echo "=== compile errors ==="
          grep -n "error:" build-kyty.log | head -60 || true
          echo "=== last 60 lines ==="
          tail -n 60 build-kyty.log || true
          echo "=== CMakeError.log ==="
          find build/kyty/cmake -name CMakeError.log -exec tail -n 60 {} \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyty-build-log
          path: build-kyty.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: kyty-build
          path: build/builds/*.zip
          if-no-files-found: error

  apk:
    needs: payload
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NDK_VERSION: "29.0.14206865"
      SHARPDROID_SDK: ${{ github.workspace }}/android-sdk
      SHARPDROID_NDK: ${{ github.workspace }}/android-sdk/ndk/29.0.14206865
      SHARPDROID_CMAKE: ${{ github.workspace }}/android-sdk/cmake/3.22.1/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FEX and libadrenotools (exact pins)
        run: python3 scripts/fetch-sources.py --only sharpdroid
      - name: Android SDK pieces the pipeline pins
        run: |
          set -e
          mkdir -p "$SHARPDROID_SDK"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --sdk_root="$SHARPDROID_SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SHARPDROID_SDK" --install \
            "ndk;$NDK_VERSION" "build-tools;35.0.0" "platforms;android-35" "cmake;3.22.1" "platform-tools"
      - uses: actions/download-artifact@v4
        with:
          name: kyty-build
          path: kyty-zip
      - name: Unpack the Kyty build
        run: |
          set -e
          mkdir -p build/kyty-build
          unzip -q kyty-zip/*.zip -d build/kyty-build
          test -f build/kyty-build/meta.json
      - name: Build host layer and APK (Kyty bundled)
        env:
          SHARPDROID_JDK: ${{ env.JAVA_HOME }}
        run: |
          chmod +x gradlew
          python3 scripts/build.py --sharpemu build/kyty-build
      - name: Collect
        run: |
          set -e
          mkdir -p dist
          APK="$(ls build/apk/*.apk | head -1)"
          cp "$APK" dist/sharpdroid-kyty.apk
          cp kyty-zip/*.zip dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: sharpdroid-kyty
          path: dist/*
          if-no-files-found: error
      - name: Release
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "kyty-${{ github.run_number }}" dist/* --title "sharpdroid-kyty ${{ github.run_number }}" --notes "built by GitHub Actions"
